[project]
name = "analisti-2027"
version = "0.1.0"
description = "Crew di ricerca qualitativa per il progetto 2027 da 3000 EUR"
requires-python = ">=3.11,<3.14"
dependencies = ["crewai>=1.15,<2", "PyYAML>=6,<7", "python-dotenv>=1,<2"]

[project.scripts]
analisti_2027 = "analisti_2027.main:run"
run_crew = "analisti_2027.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analisti_2027"]

[tool.crewai]
type = "crew"
