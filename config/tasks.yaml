validazione:
  agent: dati
  description: |
    Mandato: {mandato}
    Evidenze fornite: {evidenze}
    Valida budget, date e fonti. Elenca dati mancanti e conflitti.
    Non hai strumenti web: non fingere nuove acquisizioni.
    Distingui dati forniti dal mandato da evidenze finanziarie verificate.
    E richiede fonte esatta e data; A indica non verificato; H ipotesi;
    M sintetico; Q calcolo documentato; ND mancante.
    Un URL da consultare non e una fonte acquisita.
    I prezzi iniziali 2027 sono intenzionalmente sconosciuti nella versione
    congelata, non una lacuna da colmare con informazioni successive al cutoff.
    Verifica separatamente le lacune USD/EUR e JPY/EUR.
    Ogni ricerca proposta deve rispettare il cutoff del mandato: non chiedere
    dati attuali o futuri per riempire retroattivamente la versione congelata.
    Massimo 350 parole; non ricopiare integralmente il mandato.
  expected_output: Registro sintetico di evidenze, vincoli e lacune con etichette.
tecnologia:
  agent: tecnologia
  description: |
    Analizza AVGO, NVDA e AMZN soltanto sui materiali validati.
    Per ciascuna: driver, cassa, valutazione se nota, tesi, controtesi e invalidazione.
    Ogni fatto finanziario richiede evidenza E con fonte e data entro il cutoff.
    Senza evidenze usa ND e domande di ricerca. Eventuali ipotesi devono
    essere esplicitamente H e condizionali, mai previsioni assertive.
    Non presentare conoscenze generali del modello come fatti verificati.
    Non dichiarare che una societa crescera o beneficera senza evidenze.
    Una frase assertiva seguita da ND non diventa verificata: se un driver
    non e documentato, scrivi ND con motivo e una domanda di ricerca.
    Formula le ipotesi come condizioni esplicite, non come fatti gia accertati.
    Massimo 400 parole complessive.
  expected_output: Tre schede concise con evidenze identificate oppure ND e domande.
materiali:
  agent: materiali
  description: |
    Analizza Shin-Etsu soltanto sui materiali validati.
    Distingui diversificazione industriale, geografica e finanziaria come
    dimensioni da verificare, non come benefici gia dimostrati.
    Il beneficio rispetto alla liquidita resta ND senza dati quantitativi.
    Il confronto riguarda detenere Shin-Etsu oppure sostituire il suo budget
    con cassa nel portafoglio, non la sola liquidita finanziaria dell'azienda.
    Ogni fatto richiede E con fonte e data; altrimenti ND o H condizionale.
    Non attribuire stabilita o resilienza dimostrate senza evidenze.
    Massimo 200 parole.
  expected_output: Scheda concisa con evidenze o ND, ipotesi e verifiche richieste.
scenari:
  agent: scenari
  description: |
    Formula H1 crescita AI con utili e cassa; H2 crescita e compressione multipli;
    H10 shock combinato. Elenca variabili, assunzioni e condizioni di confutazione.
    Gli scenari sono H, non previsioni o fatti verificati.
    Non assegnare probabilita o prezzi iniziali 2027 inventati.
    Nessun motore finanziario e collegato: non calcolare rendimenti o drawdown.
    Confronta qualitativamente A/B/C, controlli senza Shin-Etsu e liquidita,
    distinguendo caratteristiche del mandato da benefici non dimostrati.
    Distingui A, B e C usando soltanto i budget del mandato; nei controlli
    trasferisci in cassa soltanto Shin-Etsu, senza redistribuire sugli altri titoli.
    Descrivi I1 ingresso iniziale, I2 terzi a gennaio/febbraio/marzo e I3 cassa;
    non dedurre benefici, rendimenti o probabilita da questi soli vincoli.
    Massimo 350 parole.
  expected_output: Matrice qualitativa sintetica, confronti e input mancanti.
revisione:
  agent: rischi
  description: |
    Contesta dati futuri, numeri senza fonte, valute, costi, budget e concentrazione.
    Classifica ogni criticita BLOCCANTE, IMPORTANTE o NOTA.
    Distingui impossibilita quantitativa e semplice incertezza.
    Riporta esempi precisi delle affermazioni non supportate dei task precedenti
    e chiedi di sostituirle con ND o H esplicite, non con un disclaimer generico.
    Controlla cutoff, USD/EUR e JPY/EUR, e distinzione fra fonti lette e riferimenti.
    Segnala link vuoti o con destinazione # e riferimenti mai acquisiti.
    Contesta richieste di dati successivi al cutoff e driver assertivi marcati ND.
    Massimo 300 parole.
  expected_output: Registro criticita con prova, impatto e correzione richiesta.
report:
  agent: report
  description: |
    Scrivi un report sintetico in italiano usando tutti i cinque task precedenti.
    Titola ANALISI PRELIMINARE NON VALIDATA.
    Non concatenare o ricopiare integralmente gli output precedenti.
    Massimo 800 parole complessive; riduci il dettaglio, non eliminare sezioni.
    Includi esattamente queste nove sezioni di secondo livello:
    1. Sintesi e stato della validazione
    2. Evidenze acquisite e riferimenti da consultare
    3. Vincoli e lacune
    4. Schede AVGO, NVDA e AMZN
    5. Scheda Shin-Etsu
    6. Scenari H1, H2 e H10
    7. Confronto A/B/C, controlli e I1/I2/I3
    8. Obiezioni e criticita della revisione
    9. Prossime verifiche
    Ogni sezione deve contenere una sintesi o ND con motivo.
    Integra le correzioni della revisione e segnala le criticita irrisolte.
    Non conservare affermazioni assertive non supportate: sostituiscile con
    ND o H esplicite e condizionali. Non inventare fonti o dati.
    Se non ci sono evidenze acquisite scrivilo; separa gli URL da consultare.
    Non inventare URL: usa soltanto indirizzi presenti nei materiali forniti,
    come riferimenti da consultare; se assenti, scrivi ND senza creare link.
    Vietati link segnaposto come [fonte](#), [fonte]() o URL inventati.
    I prezzi iniziali 2027 sono intenzionalmente sconosciuti: non richiederli
    come dati gia disponibili. Le ricerche devono rispettare il cutoff del mandato.
    Nella sezione 7 distingui A/B/C, controlli senza Shin-Etsu e I1/I2/I3;
    se non puoi valutarli scrivi ND con motivo per ciascun confronto.
    Non presentare driver non verificati come fatti con una semplice etichetta ND.
    Mantieni il cutoff del mandato. Nessuna acquisizione web o calcolo finanziario.
    Non dichiarare rendimenti, probabilita, idoneita personale o raccomandazioni operative.
    L'ultima riga deve essere esattamente il testo seguente, senza punto,
    grassetto, virgolette o testo successivo:
    FINE REPORT PRELIMINARE
  expected_output: Report Markdown sintetico con tutte le nove sezioni, etichette e riga finale.
