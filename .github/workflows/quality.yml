name: Quality tests and installable package
on:
  push:
    branches: [main, fix/report-completeness, fix/amp-absolute-import, ci/pytest-scenario-matrix, feat/autonomous-evidence-pipeline]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OTEL_SDK_DISABLED: 'true'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked test dependencies
        run: uv sync --locked --only-group test --python '3.11'
      - name: Existing unittest suite
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Parametrized pytest scenario matrix
        env:
          PYTHONPATH: src
        run: |
          mkdir -p test-results
          .venv/bin/python -m pytest tests/test_scenario_matrix.py \
            -v --strict-config --strict-markers \
            --junitxml=test-results/scenario-matrix.xml
      - name: Save pytest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-matrix-junit-${{ github.sha }}
          path: test-results/scenario-matrix.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Install build tools only
        run: python -m pip install build hatchling
      - name: Build wheel without application dependencies
        run: python -m build --wheel --no-isolation
      - name: Inspect wheel resources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
              assert len(names) == len(set(names)), 'Duplicate archive entries'
              assert 'analisti_2027/quality.py' in names
              for folder in ('config', 'knowledge'):
                  for p in Path(folder).rglob('*'):
                      if p.is_file():
                          target = 'analisti_2027/' + p.as_posix()
                          assert wheel.read(target) == p.read_bytes(), target
          print('Wheel resources verified:', wheels[0].name)
          PY
      - name: Install wheel without application dependencies
        run: python -m pip install --no-deps --target installed_package dist/*.whl
      - name: Compile installed package without invoking CrewAI
        run: python -m compileall -q installed_package/analisti_2027
      - name: Save installable package
        uses: actions/upload-artifact@v4
        with:
          name: analisti-2027-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
  runtime-import:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: analisti-2027-wheel-${{ github.sha }}
          path: runtime_dist
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked application dependencies
        run: uv sync --locked --python '${{ matrix.python-version }}'
      - name: Replace editable project with tested wheel
        run: uv pip install --reinstall --no-deps runtime_dist/*.whl
      - name: Test package and AMP-like loose imports without kickoff
        run: .venv/bin/python scripts/smoke_amp_import.py
