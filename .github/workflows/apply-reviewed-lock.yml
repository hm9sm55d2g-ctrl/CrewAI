name: Apply reviewed lock and verify CI
on:
  push:
    branches: [ci/pytest-scenario-matrix]
    paths: ['.github/workflows/apply-reviewed-lock.yml']
permissions:
  contents: write
  actions: write
jobs:
  apply-and-verify:
    if: github.repository == 'hm9sm55d2g-ctrl/CrewAI' && github.ref == 'refs/heads/ci/pytest-scenario-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: hm9sm55d2g-ctrl/CrewAI
      TARGET_BRANCH: ci/pytest-scenario-matrix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact reviewed bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object uv.lock)" = '4fd7b13f1686b5c37e5560d8037903b074e599ec'
          git apply --check .github/patches/reviewed-uv-lock.patch
          git apply .github/patches/reviewed-uv-lock.patch
          test "$(git hash-object uv.lock)" = 'f8c48280cfed37063ac71b65d7b494ebd929891a'
          test "$(git diff --name-only)" = 'uv.lock'
      - name: Check resolved lock without regenerating
        run: |
          python -m pip install 'uv==0.13.6'
          uv lock --check
          test "$(git hash-object uv.lock)" = 'f8c48280cfed37063ac71b65d7b494ebd929891a'
      - name: Commit only reviewed uv.lock to the dedicated branch
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- uv.lock
          test "$(git diff --cached --name-only)" = 'uv.lock'
          git commit -m 'build: save exact reviewed pytest lockfile'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Reviewed lock commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch quality on the resulting commit and await outcome
        env:
          LOCK_SHA: ${{ steps.lock.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run quality.yml --ref "$TARGET_BRANCH"
          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh run list --workflow quality.yml --branch "$TARGET_BRANCH" --commit "$LOCK_SHA" --event workflow_dispatch --limit 10 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "Quality run: $run_id for $LOCK_SHA" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" --exit-status --interval 10
