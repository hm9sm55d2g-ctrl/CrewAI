name: Real hook lifecycle without LLM
on:
  push:
    branches: [test/amp-hook-lifecycle, feat/autonomous-evidence-pipeline]
  pull_request:
    paths:
      - scripts/test_hook_lifecycle.py
      - .github/workflows/hook-lifecycle.yml
      - src/analisti_2027/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hook-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TRACING_ENABLED: 'false'
      CREW_MODEL: gpt-4o-mini
      OPENAI_API_KEY: sk-offline-test-not-a-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked application dependencies
        run: uv sync --locked --python '${{ matrix.python }}'
      - name: Real kickoff and akickoff without LLM or network
        run: .venv/bin/python scripts/test_hook_lifecycle.py
      - name: Preserve lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hook-lifecycle-${{ matrix.python }}-${{ github.sha }}
          path: output/hook-lifecycle.json
          if-no-files-found: warn
          retention-days: 7
