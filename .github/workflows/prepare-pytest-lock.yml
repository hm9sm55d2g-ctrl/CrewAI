name: Prepare pytest dependency lock
on:
  push:
    branches: [ci/pytest-scenario-matrix]
    paths:
      - '.github/workflows/prepare-pytest-lock.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve-test-dependencies:
    if: github.ref == 'refs/heads/ci/pytest-scenario-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OTEL_SDK_DISABLED: 'true'
      PYTHONPATH: src
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install resolver
        run: python -m pip install uv
      - name: Resolve test group and regenerate lock
        run: |
          uv --version
          uv add --group test 'pytest>=8,<9' --no-sync
          uv lock --check
      - name: Prepare reviewable files before tests
        run: |
          mkdir -p lock-review
          cp pyproject.toml uv.lock lock-review/
          git diff --binary -- pyproject.toml uv.lock > lock-review/dependencies.patch
          git rev-parse HEAD > lock-review/source-commit.txt
          uv --version > lock-review/resolver-version.txt
      - name: Install test group without application dependencies
        run: uv sync --locked --only-group test --python '3.11'
      - name: Verify pytest installation
        run: .venv/bin/python -m pytest --version
      - name: Run existing offline unittest suite
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Upload resolved files for review, never commit automatically
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-lock-review-${{ github.sha }}
          path: lock-review/
          if-no-files-found: error
          retention-days: 7
